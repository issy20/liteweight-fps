[package]
name = "liteweight-fps"
version = "0.1.0"
edition = "2021"
default-run = "liteweight-fps"

[dependencies]
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
miniquad = "0.4.11"
pollster = "0.4"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
wgpu = "24"
winit = "0.30"

[profile.release]
lto = "thin"
strip = true
