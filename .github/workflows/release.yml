name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable action revision
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit locked dependencies against RustSec
        run: cargo audit

  verify-packages:
    # Internal verification of the 4-target build and packaging scripts.
    # Nothing from this job is published; releases are source-only.
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            package: linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: windows-x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            package: macos-aarch64
          - runner: macos-latest
            target: x86_64-apple-darwin
            package: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable action revision
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers xvfb
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin liteweight-fps
      - name: Generate dependency license inventory
        run: python scripts/dependency_notices.py --output target/THIRD_PARTY_NOTICES.txt
      - name: Inspect Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd "target/${{ matrix.target }}/release/liteweight-fps" | tee target/linux-runtime-dependencies.txt
          if grep -q "not found" target/linux-runtime-dependencies.txt; then exit 1; fi
      - name: Run a software-rendered Linux startup smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: timeout 35s xvfb-run -a -s "-screen 0 1280x720x24" "target/${{ matrix.target }}/release/liteweight-fps" --smoke
      - name: Package Release binary
        run: python scripts/package_release.py --target "${{ matrix.target }}" --release-dir "target/${{ matrix.target }}/release" --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: liteweight-fps-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    # Creates a source-only draft release. GitHub attaches the source archives;
    # no binaries are published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --check-tag "$RELEASE_TAG"
      - name: Create draft GitHub Release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
